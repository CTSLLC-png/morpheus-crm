name: MDR real schema integrated preflight
on:
  pull_request:
    paths:
      - 'sql/tests/healthcare_real_schema_preflight_integration.sql'
      - 'sql/tests/healthcare_real_schema_smoke_bootstrap.sql'
      - 'sql/proposals/healthcare_*.sql'
      - '.github/workflows/healthcare-real-schema-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_real_preflight
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_real_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_real_preflight
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable production-shaped parents
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_real_schema_smoke_bootstrap.sql
      - name: Install actual proposed MDR schemas, locks and preflight
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_credentialing_secure_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_credential_evidence_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_access_exception_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_authority_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_approver_verification_provenance.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_approver_verification_integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_visit_scope.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_withdrawal_lock.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_state_integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_evidence_eligibility_readonly.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_evidence_revocation_locking.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_hard_stop_serialization.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_integrated_safety_lock_order.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_facility_policy_serialization.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_dispatch_preflight_integrated_disabled.sql
      - name: Test real preflight missing valid banned revoked cases
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_real_schema_preflight_integration.sql
