name: MDR actual hospital exception preflight integration
on:
  pull_request:
    paths:
      - 'sql/tests/healthcare_exception_preflight_*'
      - '.github/workflows/healthcare-exception-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'sql/tests/healthcare_exception_preflight_*'
      - '.github/workflows/healthcare-exception-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exception:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_exception_preflight
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_exception_preflight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_exception_preflight
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Create disposable parent schema
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_exception_preflight_bootstrap.sql
      - name: Install actual exception and authority proposals
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_access_exception_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_authority_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_visit_scope.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_withdrawal_lock.sql
      - name: Install actual unified disabled preflight
        run: psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_dispatch_preflight_integrated_disabled.sql
      - name: Test exception approval hard-stop and withdrawal
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_exception_preflight_integration.sql
