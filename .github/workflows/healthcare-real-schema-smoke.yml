name: MDR real proposal schema smoke
on:
  pull_request:
    paths:
      - 'sql/tests/healthcare_real_schema_smoke_*'
      - '.github/workflows/healthcare-real-schema-smoke.yml'
      - 'sql/proposals/healthcare_credentialing_secure_staging.sql'
      - 'sql/proposals/healthcare_credential_evidence_staging.sql'
      - 'sql/proposals/healthcare_access_exception_staging.sql'
      - 'sql/proposals/healthcare_evidence_eligibility_readonly.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_real_schema
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_real_schema"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_real_schema
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Bootstrap disposable parents
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_real_schema_smoke_bootstrap.sql
      - name: Install actual proposed MDR credential and exception schemas
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_credentialing_secure_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_credential_evidence_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_access_exception_staging.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_authority_gate.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_approver_verification_provenance.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_approver_verification_integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_visit_scope.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_withdrawal_lock.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_exception_state_integrity.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_evidence_eligibility_readonly.sql
      - name: Run real credential eligibility scenarios
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_real_schema_smoke_integration.sql
