name: Healthcare credential evidence PostgreSQL integration
on:
  pull_request:
    paths:
      - 'sql/proposals/healthcare_credential_evidence_staging.sql'
      - 'sql/tests/healthcare_evidence_postgres_*.sql'
      - '.github/workflows/healthcare-evidence-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'sql/proposals/healthcare_credential_evidence_staging.sql'
      - 'sql/tests/healthcare_evidence_postgres_*.sql'
      - '.github/workflows/healthcare-evidence-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-fk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_evidence_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_evidence_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_evidence_test
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Build isolated schema
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_evidence_postgres_bootstrap.sql
      - name: Apply evidence proposal to disposable database
        run: psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_credential_evidence_staging.sql
      - name: Execute evidence isolation checks
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_evidence_postgres_isolated.sql
