name: MDR combined safety concurrency
on:
  pull_request:
    paths:
      - 'sql/proposals/healthcare_integrated_safety_lock_order.sql'
      - 'sql/tests/healthcare_integrated_safety_*'
      - '.github/workflows/healthcare-integrated-safety.yml'
  push:
    branches: [main]
    paths:
      - 'sql/proposals/healthcare_integrated_safety_lock_order.sql'
      - 'sql/tests/healthcare_integrated_safety_*'
      - '.github/workflows/healthcare-integrated-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_safety_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_safety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_safety_test
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Create disposable fixture
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_integrated_safety_bootstrap.sql
      - name: Install credential write lock
        run: psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_evidence_revocation_locking.sql
      - name: Install facility exclusion lock
        run: psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_hard_stop_serialization.sql
      - name: Install combined lock order
        run: psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_integrated_safety_lock_order.sql
      - name: Test simultaneous safety mutations
        run: bash sql/tests/healthcare_integrated_safety_concurrency.sh
