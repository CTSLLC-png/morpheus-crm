name: MDR integrated disabled preflight contract
on:
  pull_request:
    paths:
      - 'sql/proposals/healthcare_dispatch_preflight_integrated_disabled.sql'
      - 'sql/tests/healthcare_integrated_preflight_contract.sql'
      - '.github/workflows/healthcare-integrated-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'sql/proposals/healthcare_dispatch_preflight_integrated_disabled.sql'
      - 'sql/tests/healthcare_integrated_preflight_contract.sql'
      - '.github/workflows/healthcare-integrated-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_preflight_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_preflight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_preflight_test
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Create disposable schema
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA melrah;
          CREATE SCHEMA core;
          DO $$
          BEGIN
           IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF;
           IF NOT EXISTS(SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF;
          END $$;
          CREATE TABLE melrah.work_order(
           id uuid PRIMARY KEY,tenant_id uuid,facility_id uuid,account_id uuid,
           program_key text,status text,assigned_resource_id uuid);
          CREATE TABLE melrah.healthcare_access_exception(
           id uuid PRIMARY KEY,requirement_id uuid);
          CREATE TABLE melrah.healthcare_access_exclusion(
           tenant_id uuid,facility_id uuid,technician_id uuid,
           active boolean,effective_at timestamptz);
          CREATE FUNCTION core.member_of(uuid) RETURNS boolean LANGUAGE sql AS 'SELECT false';
          CREATE FUNCTION melrah.healthcare_lock_facility_policy(uuid,uuid)
           RETURNS void LANGUAGE sql AS 'SELECT';
          CREATE FUNCTION melrah.healthcare_lock_dispatch_safety_scope(uuid,uuid,uuid)
           RETURNS void LANGUAGE sql AS 'SELECT';
          CREATE FUNCTION melrah.healthcare_evidence_eligible(uuid,uuid)
           RETURNS boolean LANGUAGE sql AS 'SELECT false';
          CREATE FUNCTION melrah.healthcare_exception_lock_for_dispatch(uuid)
           RETURNS melrah.healthcare_access_exception LANGUAGE sql AS
           'SELECT * FROM melrah.healthcare_access_exception WHERE false';
          CREATE FUNCTION melrah.healthcare_exception_matches_visit(uuid,uuid,uuid,uuid,timestamptz)
           RETURNS boolean LANGUAGE sql AS 'SELECT false';
          SQL
      - name: Install fail-closed preflight
        run: psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_dispatch_preflight_integrated_disabled.sql
      - name: Verify non-authorizing contract
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_integrated_preflight_contract.sql
