name: Creator Studio render queue security
on:
  pull_request:
    paths:
      - 'sql/0016_creator_studio.sql'
      - 'sql/0022_creator_studio_render_queue.sql'
      - 'sql/tests/creator_studio_*.sql'
      - 'sql/0021_tenant_scope_growth_modules.sql'
      - 'sql/tests/tenant_scope_*.sql'
      - 'src/modules/studio/**'
      - 'tools/video/queue*.mjs'
      - '.github/workflows/creator-studio.yml'
  push:
    branches: [main]
    paths:
      - 'sql/0016_creator_studio.sql'
      - 'sql/0022_creator_studio_render_queue.sql'
      - 'sql/tests/creator_studio_*.sql'
      - 'sql/0021_tenant_scope_growth_modules.sql'
      - 'sql/tests/tenant_scope_*.sql'
      - 'src/modules/studio/**'
      - 'tools/video/queue*.mjs'
      - '.github/workflows/creator-studio.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  creator-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creator_studio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d creator_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: creator_studio
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (render queue helpers and worker client)
        run: node --test src/modules/studio/renderQueue.test.js tools/video/queue.test.mjs
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Kernel, auth and storage stand-ins
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/tenant_scope_bootstrap.sql
      - name: Install the module migrations, existing CTS rows and tenant scoping
        run: |
          for f in 0014_legacy_growth_campaigns 0015_growth_asset_media_url 0016_creator_studio 0018_artist_hub 0019_campaign_publishing; do
            psql -X -q -v ON_ERROR_STOP=1 -f "sql/$f.sql"
          done
          psql -X -q -v ON_ERROR_STOP=1 -f sql/tests/tenant_scope_seed.sql
          psql -X -q -v ON_ERROR_STOP=1 -f sql/0021_tenant_scope_growth_modules.sql
          psql -X -q -v ON_ERROR_STOP=1 -f sql/0022_creator_studio_render_queue.sql
      - name: Test staff, public, other-client and worker access and re-run safety
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/creator_studio_render_queue_integration.sql
