name: MDR real credential preflight integration
on:
  pull_request:
    paths:
      - 'sql/tests/healthcare_real_credential_preflight_*'
      - '.github/workflows/healthcare-real-credential-preflight.yml'
      - 'sql/proposals/healthcare_evidence_eligibility_readonly.sql'
      - 'sql/proposals/healthcare_dispatch_preflight_integrated_disabled.sql'
  push:
    branches: [main]
    paths:
      - 'sql/tests/healthcare_real_credential_preflight_*'
      - '.github/workflows/healthcare-real-credential-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_real_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_real_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_real_integration
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Create representative fixture
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_real_credential_preflight_bootstrap.sql
      - name: Install actual access and credential lock helpers
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_evidence_revocation_locking.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_hard_stop_serialization.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_integrated_safety_lock_order.sql
      - name: Install facility lock with representative policy tables
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE TABLE melrah.healthcare_facility_approver(tenant_id uuid,facility_id uuid);"
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_facility_policy_serialization.sql
      - name: Install real eligibility and unified preflight
        run: |
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_evidence_eligibility_readonly.sql
          psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_dispatch_preflight_integrated_disabled.sql
      - name: Execute integrated safety scenarios
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_real_credential_preflight_integration.sql
