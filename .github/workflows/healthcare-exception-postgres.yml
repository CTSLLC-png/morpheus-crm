name: MDR facility exception PostgreSQL staging
on:
  pull_request:
    paths:
      - 'sql/proposals/healthcare_access_exception_staging.sql'
      - 'sql/tests/healthcare_exception_*.sql'
      - '.github/workflows/healthcare-exception-postgres.yml'
  push:
    branches: [main]
    paths:
      - 'sql/proposals/healthcare_access_exception_staging.sql'
      - 'sql/tests/healthcare_exception_*.sql'
      - '.github/workflows/healthcare-exception-postgres.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exception-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: healthcare_exception_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthcare_exception_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: healthcare_exception_test
      PGUSER: postgres
      PGPASSWORD: disposable_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Create disposable fixture
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_exception_bootstrap.sql
      - name: Install proposed exception schema
        run: psql -X -v ON_ERROR_STOP=1 -f sql/proposals/healthcare_access_exception_staging.sql
      - name: Test exception controls
        run: psql -X -v ON_ERROR_STOP=1 -f sql/tests/healthcare_exception_staging_integration.sql
