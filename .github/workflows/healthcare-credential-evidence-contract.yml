name: Healthcare credential evidence static contract

on:
  pull_request:
    paths:
      - 'sql/proposals/healthcare_credential_evidence_staging.sql'
      - 'sql/tests/healthcare_credential_evidence_contract.test.js'
      - '.github/workflows/healthcare-credential-evidence-contract.yml'
  push:
    branches: [main]
    paths:
      - 'sql/proposals/healthcare_credential_evidence_staging.sql'
      - 'sql/tests/healthcare_credential_evidence_contract.test.js'
      - '.github/workflows/healthcare-credential-evidence-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test sql/tests/healthcare_credential_evidence_contract.test.js
