<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Spectral; font-weight: 600; src: url(node_modules/@fontsource/spectral/files/spectral-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: Spectral; font-weight: 700; src: url(node_modules/@fontsource/spectral/files/spectral-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Public Sans'; font-weight: 400; src: url(node_modules/@fontsource/public-sans/files/public-sans-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Public Sans'; font-weight: 600; src: url(node_modules/@fontsource/public-sans/files/public-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Public Sans'; font-weight: 700; src: url(node_modules/@fontsource/public-sans/files/public-sans-latin-700-normal.woff2) format('woff2'); }

  :root {
    --forest: #1C3D35; --forest-2: #24503F; --gold: #9C6A1E; --gold-soft: #F4E7CF;
    --cream: #F3F5F1; --ink: #17231F; --muted: #56655F; --line: #D5DDD6; --white: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--cream); }
  body { font-family: 'Public Sans', sans-serif; color: var(--ink); }
  #stage { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  .scene { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
           align-items: center; gap: 3.2vmin; padding: 7vmin 8vmin 16vmin; opacity: 0; }
  .eyebrow { font-family: 'Public Sans'; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
             color: var(--gold); font-size: 2.3vmin; }
  .headline { font-family: Spectral; font-weight: 700; color: var(--forest); text-align: center;
              font-size: 8vmin; line-height: 1.08; max-width: 88vw; }
  .v .headline { font-size: 9vmin; }

  /* family */
  .family svg { width: 62vmin; height: auto; }

  /* screener */
  .phone { width: 46vmin; background: var(--white); border: .5vmin solid var(--forest); border-radius: 5vmin;
           padding: 4vmin 3vmin; display: flex; flex-direction: column; gap: 1.8vmin; box-shadow: 0 3vmin 6vmin rgba(28,61,53,.15); }
  .v .phone { width: 64vmin; }
  .chip { display: flex; align-items: center; gap: 1.6vmin; background: var(--cream); border: .25vmin solid var(--line);
          border-radius: 1.6vmin; padding: 1.8vmin 2vmin; font-size: 2.3vmin; font-weight: 600; color: var(--ink); }
  .v .chip { font-size: 2.8vmin; }
  .check { width: 3.4vmin; height: 3.4vmin; border-radius: 50%; background: var(--forest); color: var(--white);
           display: grid; place-items: center; font-size: 2vmin; flex: none; }
  .badge { background: var(--gold); color: var(--white); font-weight: 700; font-size: 2.8vmin; padding: 1.4vmin 3vmin; border-radius: 10vmin; }
  .note { font-size: 2.3vmin; color: var(--muted); font-weight: 600; }
  .h .screener-row { display: flex; align-items: center; gap: 8vmin; }
  .v .screener-row { display: flex; flex-direction: column; align-items: center; gap: 4vmin; }
  .screener-copy { display: flex; flex-direction: column; gap: 2.4vmin; align-items: flex-start; max-width: 60vmin; }
  .v .screener-copy { align-items: center; text-align: center; }
  .screener-copy .headline { text-align: left; font-size: 7vmin; }
  .v .screener-copy .headline { text-align: center; }

  /* plan */
  .columns { display: flex; gap: 3vmin; width: 100%; justify-content: center; }
  .v .columns { flex-direction: column; width: 76vmin; }
  .col { flex: 1; max-width: 50vmin; background: var(--white); border-radius: 2.4vmin; padding: 3vmin; border: .25vmin solid var(--line);
         display: flex; flex-direction: column; gap: 1.6vmin; box-shadow: 0 2vmin 4vmin rgba(28,61,53,.08); }
  .v .col { max-width: none; }
  .col h3 { font-family: Spectral; font-weight: 700; font-size: 4vmin; color: var(--forest); }
  .col:nth-child(1) h3 { color: var(--gold); }
  .col li { list-style: none; font-size: 2.5vmin; font-weight: 600; padding: 1.2vmin 1.6vmin; background: var(--cream); border-radius: 1.2vmin; }
  .v .col li { font-size: 3vmin; }

  /* guides */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.2vmin; width: min(150vmin, 90vw); }
  .v .tiles { grid-template-columns: repeat(2, 1fr); width: 84vmin; }
  .tile { background: var(--forest); color: var(--white); border-radius: 2.2vmin; padding: 3.2vmin 2.4vmin;
          font-weight: 700; font-size: 2.8vmin; min-height: 13vmin; display: flex; align-items: flex-end; }
  .v .tile { font-size: 3.2vmin; min-height: 16vmin; }
  .tile:nth-child(3n+2) { background: var(--forest-2); }
  .price { background: var(--gold-soft); color: var(--forest); border: .3vmin solid var(--gold); font-weight: 700;
           font-size: 3.2vmin; padding: 1.6vmin 3.6vmin; border-radius: 10vmin; }

  /* end card */
  .endcard { background: var(--forest); }
  .endcard .headline { color: var(--white); font-size: 10vmin; }
  .endcard .tagline { font-family: Spectral; font-weight: 600; color: var(--gold-soft); font-size: 4.4vmin; text-align: center; }
  .endcard .cta { background: var(--gold); color: var(--white); font-weight: 700; font-size: 3.4vmin; padding: 1.8vmin 4vmin; border-radius: 10vmin; }
  .endcard .mark { width: 16vmin; height: 16vmin; color: var(--white); }
  .endcard .disclaimer { position: absolute; left: 6vmin; right: 6vmin; bottom: 4vmin; text-align: center;
                         color: rgba(255,255,255,.82); font-size: 1.9vmin; line-height: 1.4; }

  /* persistent chrome */
  .brand { position: absolute; top: 4vmin; left: 5vmin; display: flex; align-items: center; gap: 1.4vmin;
           color: var(--forest); font-family: Spectral; font-weight: 700; font-size: 3vmin; }
  .brand svg { width: 5vmin; height: 5vmin; }
  .captions { position: absolute; left: 50%; bottom: 5vmin; transform: translateX(-50%); width: min(84vw, 140vmin);
              text-align: center; font-weight: 700; font-size: 3.2vmin; line-height: 1.35; color: var(--white);
              background: rgba(23,35,31,.86); padding: 1.6vmin 2.6vmin; border-radius: 1.6vmin; }
  .v .captions { font-size: 3.6vmin; bottom: 7vmin; }
  .captions:empty { display: none; }
  .progress { position: absolute; left: 0; bottom: 0; height: .7vmin; background: var(--gold); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const MARK = `<svg viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 22 C 11 22, 11 14, 15 14 S 19 8, 24 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="6" cy="22" r="2.2" fill="currentColor"/><circle cx="15" cy="14" r="2.2" fill="currentColor"/><circle cx="24" cy="8" r="2.2" fill="currentColor"/></svg>`

// Three generations around a table: abstract, warm, no stock imagery.
const FAMILY = `<svg viewBox="0 0 400 260" aria-hidden="true">
  <rect x="30" y="200" width="340" height="14" rx="7" fill="#9C6A1E"/>
  <g data-anim="up" data-at="0.2"><circle cx="95" cy="92" r="30" fill="#24503F"/><path d="M45 200 Q95 120 145 200Z" fill="#1C3D35"/></g>
  <g data-anim="up" data-at="0.45"><circle cx="200" cy="72" r="34" fill="#9C6A1E"/><path d="M140 200 Q200 100 260 200Z" fill="#24503F"/></g>
  <g data-anim="up" data-at="0.7"><circle cx="300" cy="118" r="22" fill="#1C3D35"/><path d="M262 200 Q300 146 338 200Z" fill="#9C6A1E"/></g>
  <g data-anim="pop" data-at="1.1"><circle cx="200" cy="30" r="10" fill="none" stroke="#9C6A1E" stroke-width="3"/><path d="M200 22v16M192 30h16" stroke="#9C6A1E" stroke-width="3" stroke-linecap="round"/></g>
</svg>`

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

function sceneHTML(s) {
  const eyebrow = s.eyebrow ? `<div class="eyebrow" data-anim="fade" data-at="0">${esc(s.eyebrow)}</div>` : ''
  switch (s.kind) {
    case 'family':
      return `<div class="scene family">${eyebrow}<div>${FAMILY}</div>
        <div class="headline" data-anim="up" data-at="1.4">${esc(s.headline)}</div></div>`
    case 'screener':
      return `<div class="scene">${eyebrow}<div class="screener-row">
        <div class="phone" data-anim="up" data-at="0.2">
          ${s.chips.map((c, i) => `<div class="chip" data-anim="left" data-at="${0.8 + i * 0.7}"><span class="check">✓</span>${esc(c)}</div>`).join('')}
        </div>
        <div class="screener-copy">
          <div class="headline" data-anim="up" data-at="0.5">${esc(s.headline)}</div>
          <div class="badge" data-anim="pop" data-at="1.2">Takes about five minutes</div>
          <div class="note" data-anim="fade" data-at="${1.2 + s.chips.length * 0.7}">${esc(s.note)}</div>
        </div></div></div>`
    case 'plan':
      return `<div class="scene">${eyebrow}<div class="columns">
        ${s.columns.map((c, i) => `<div class="col" data-anim="up" data-at="${0.3 + i * 0.9}"><h3>${esc(c.label)}</h3><ul>
          ${c.items.map((it, j) => `<li data-anim="fade" data-at="${0.6 + i * 0.9 + j * 0.25}">${esc(it)}</li>`).join('')}</ul></div>`).join('')}
        </div></div>`
    case 'guides':
      return `<div class="scene">${eyebrow}<div class="tiles">
        ${s.tiles.map((t, i) => `<div class="tile" data-anim="pop" data-at="${0.5 + i * 0.9}">${esc(t)}</div>`).join('')}
        </div><div class="price" data-anim="up" data-at="${0.8 + s.tiles.length * 0.9}">${esc(s.price)}</div></div>`
    case 'endcard':
      return `<div class="scene endcard"><div class="mark" data-anim="pop" data-at="0.1">${MARK}</div>
        <div class="headline" data-anim="up" data-at="0.3">${esc(s.headline)}</div>
        <div class="tagline" data-anim="up" data-at="0.8">${esc(s.tagline)}</div>
        <div class="cta" data-anim="pop" data-at="1.4">${esc(s.cta)}</div>
        <div class="disclaimer" data-anim="fade" data-at="0.6">${esc(window.__SCRIPT.disclaimer)}</div></div>`
  }
  throw new Error('Unknown scene kind: ' + s.kind)
}

const ease = x => 1 - Math.pow(1 - Math.min(Math.max(x, 0), 1), 3)
const TRANS = {
  fade: p => ({ opacity: p, transform: 'none' }),
  up:   p => ({ opacity: p, transform: `translateY(${(1 - p) * 4}vmin)` }),
  left: p => ({ opacity: p, transform: `translateX(${(1 - p) * -4}vmin)` }),
  pop:  p => ({ opacity: p, transform: `scale(${0.85 + 0.15 * p})` }),
}

window.setup = (script, orientation) => {
  window.__SCRIPT = script
  document.body.className = orientation
  const stage = document.getElementById('stage')
  stage.innerHTML = script.scenes.map(sceneHTML).join('') +
    `<div class="brand" id="brand">${MARK}<span>Legacy Path</span></div><div class="captions" id="cap"></div><div class="progress" id="bar"></div>`
  window.__els = [...stage.querySelectorAll('.scene')].map(el => ({ el, parts: [...el.querySelectorAll('[data-anim]')] }))
  return document.fonts.ready.then(() => true)
}

// Deterministic: every frame is a pure function of t, so renders are repeatable.
window.renderAt = (t) => {
  const { scenes, captions, total } = window.__SCRIPT.timeline
  const FADE = 0.45
  scenes.forEach((s, i) => {
    const { el, parts } = window.__els[i]
    const local = t - s.start
    const fadeIn = i === 0 ? 1 : ease(local / FADE)
    const fadeOut = i === scenes.length - 1 ? 1 : 1 - ease((local - s.dur + FADE) / FADE)
    el.style.opacity = local < 0 || local > s.dur ? 0 : Math.min(fadeIn, fadeOut)
    for (const p of parts) {
      const k = ease((local - Number(p.dataset.at)) / 0.6)
      Object.assign(p.style, TRANS[p.dataset.anim](k))
    }
  })
  const onEnd = t >= scenes[scenes.length - 1].start
  document.getElementById('brand').style.opacity = onEnd ? 0 : 1
  const cap = captions.find(c => t >= c.start && t < c.end)
  document.getElementById('cap').textContent = cap && !onEnd ? cap.text : ''
  document.getElementById('bar').style.width = `${(t / total) * 100}%`
}
</script>
</body>
</html>
